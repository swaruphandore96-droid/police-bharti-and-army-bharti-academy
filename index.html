<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Police Bharti & Army Bharti Academy</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5fa;color:#172033}
header{background:#101d3a;color:white;padding:24px 16px;text-align:center}
header h1{font-size:25px;margin:8px 0}
header p{color:#dbe5ff}
nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:14px;background:#fff}
button{border:0;border-radius:10px;padding:12px 16px;font-size:15px;cursor:pointer;background:#174ea6;color:white}
main{max-width:850px;margin:20px auto;padding:0 14px}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px #0000000c}
h2{margin-top:0;color:#143b7a}
.exam{display:block;width:100%;margin:10px 0;padding:17px;text-align:left;font-weight:bold}
.option{display:block;width:100%;margin:9px 0;background:#edf2fa;color:#182238;text-align:left}
.option:hover{background:#dce8ff}
#feedback{font-weight:bold;margin-top:14px}
footer{text-align:center;padding:25px;color:#65708a}
.small{font-size:13px;color:#697386}
</style>
</head>
<body>
<header>
<div>🇮🇳 BHARTI EXAM PORTAL</div>
<h1>POLICE BHARTI & ARMY BHARTI</h1>
<p>तयारी आजची • यश उद्याचं</p>
</header>

<nav>
<button onclick="home()">Home</button>
<button onclick="showExam('police')">Police Bharti</button>
<button onclick="showExam('army')">Army Bharti</button>
</nav>

<main id="app">
<section class="card">
<h2>स्वागत आहे! 🇮🇳</h2>
<p>पोलीस भरती आणि आर्मी भरती परीक्षेची तयारी इथून सुरू करा.</p>
<div class="small">ही सुरुवातीची आवृत्ती आहे. सराव प्रश्न आहेत; ते अधिकृत मागील वर्षांचे प्रश्न असल्याचा दावा नाही.</div>
</section>
<section class="card">
<h2>तुमची परीक्षा निवडा</h2>
<button class="exam" onclick="showExam('police')">👮 महाराष्ट्र पोलीस भरती</button>
<button class="exam" onclick="showExam('army')">🪖 आर्मी भरती — Agniveer GD</button>
</section>
</main>

<footer>© 2026 • Bharti Exam Portal</footer>

<script>
const questions={
police:[
{mr:"महाराष्ट्राची राजधानी कोणती?",en:"What is the capital of Maharashtra?",o:["पुणे / Pune","मुंबई / Mumbai","नाशिक / Nashik","नागपूर / Nagpur"],a:1,ex:"मुंबई ही महाराष्ट्राची राजधानी आहे. / Mumbai is the capital of Maharashtra."},
{mr:"25 × 6 = किती?",en:"What is 25 × 6?",o:["125","150","175","200"],a:1,ex:"25 × 6 = 150. / उत्तर 150 आहे."},
{mr:"भारताचा प्रजासत्ताक दिन कधी असतो?",en:"When is India's Republic Day?",o:["15 ऑगस्ट / 15 August","26 जानेवारी / 26 January","2 ऑक्टोबर / 2 October","1 मे / 1 May"],a:1,ex:"भारताचा प्रजासत्ताक दिन 26 जानेवारीला असतो. / Republic Day is on 26 January."}
],
army:[
{mr:"भारताची राजधानी कोणती?",en:"What is the capital of India?",o:["मुंबई / Mumbai","नवी दिल्ली / New Delhi","चेन्नई / Chennai","जयपूर / Jaipur"],a:1,ex:"नवी दिल्ली ही भारताची राजधानी आहे. / New Delhi is the capital of India."},
{mr:"12 × 8 = किती?",en:"What is 12 × 8?",o:["84","96","108","88"],a:1,ex:"12 × 8 = 96. / उत्तर 96 आहे."},
{mr:"भारतीय सैन्य दिन कधी साजरा केला जातो?",en:"When is Indian Army Day observed?",o:["15 जानेवारी / 15 January","26 जानेवारी / 26 January","15 ऑगस्ट / 15 August","4 डिसेंबर / 4 December"],a:0,ex:"भारतीय सैन्य दिन 15 जानेवारीला साजरा केला जातो. / Army Day is observed on 15 January."}
]
};
let current=[],index=0,score=0,answered=false;
function home(){
document.getElementById('app').innerHTML=`
<section class="card"><h2>स्वागत आहे! 🇮🇳</h2><p>तुमची परीक्षा निवडा.</p>
<button class="exam" onclick="showExam('police')">👮 पोलीस भरती</button>
<button class="exam" onclick="showExam('army')">🪖 आर्मी भरती</button></section>`;
}
function showExam(type){
current=questions[type];index=0;score=0;
render(type==='police'?'महाराष्ट्र पोलीस भरती':'आर्मी भरती');
}
function render(title){
answered=false;
let q=current[index];
document.getElementById('app').innerHTML=`
<section class="card"><h2>${title}</h2>
<p>प्रश्न ${index+1} / ${current.length} • गुण: ${score}</p>
<h3>${q.mr}</h3><p>${q.en}</p>
<div id="opts">${q.o.map((v,i)=>`<button class="option" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${v}</button>`).join('')}</div>
<div id="feedback"></div><div id="next"></div>
</section>`;
}
function answer(i){
if(answered)return;answered=true;
let q=current[index];
if(i===q.a)score++;
document.getElementById('feedback').innerHTML=
(i===q.a?'✅ बरोबर उत्तर!':'❌ योग्य उत्तर: '+q.o[q.a])+
'<br>'+q.ex;
document.getElementById('next').innerHTML=
`<p>आतापर्यंतचे गुण: ${score}</p><button onclick="nextQ()">${index===current.length-1?'निकाल पहा':'पुढचा प्रश्न'}</button>`;
}
function nextQ(){
if(index<current.length-1){index++;render('सराव परीक्षा');return;}
document.getElementById('app').innerHTML=`
<section class="card"><h2>तुमचा निकाल 🎯</h2>
<h3>${current.length} पैकी ${score} गुण</h3>
<p>टक्केवारी: ${Math.round(score/current.length*100)}%</p>
<button onclick="home()">मुख्य पानावर जा</button>
</section>`;
}
</script>
</body>
  </html>
